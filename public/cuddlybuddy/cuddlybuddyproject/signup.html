<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuddlyBuddy - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="CuddlyBuddy.html" class="logo">CuddlyBuddy</a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About</a>
        </div>

        <div class="auth-btns">
            <a href="CuddlyBuddy.html" class="btn-signin">Sign In</a>
            <a href="signup.html" class="btn-signup">Sign Up</a>
        </div>
    </nav>

    <div class="main-wrapper">

        <div class="login-card">

            <div class="mascot-circle">
                <img src="https://uploads.onecompiler.io/443rwj26x/44nu6v2bu/keropii%20bgr.png" alt="Frog Mascot" class="mascot-img">
            </div>

            <h2>JOIN THE FAMILY!</h2>
            <h1>SIGN UP</h1>

            <form id="signupForm">

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                   <input type="password" placeholder="Create password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="login-btn">
                    CREATE ACCOUNT
                </button>

            </form>

            <div class="social-auth">

                <button type="button" id="facebookLogin" class="fb-btn">
                    Continue with Facebook
                </button>

                <button type="button" id="googleLogin" class="google-btn">
                    Continue with Google
                </button>

            </div>

            <p class="signup-link">
                Already have an account?
                <a href="CuddlyBuddy.html">Sign In</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
