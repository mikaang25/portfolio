<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuddlyBuddy - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="CuddlyBuddy.html" class="logo">CuddlyBuddy</a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About</a>
        </div>

        <div class="auth-btns">
            <a href="CuddlyBuddy.html" class="btn-signin">Sign In</a>
            <a href="signup.html" class="btn-signup">Sign Up</a>
        </div>

    </nav>

    <div class="main-wrapper">
        <div class="login-card">

            <div class="mascot-circle">
                <img src="https://uploads.onecompiler.io/443rwj26x/44nu6v2bu/keropii%20bgr.png" alt="Frog Mascot" class="mascot-img">
            </div>

            <h2>WELCOME BACK!</h2>
            <h1>SIGN IN</h1>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    SIGN IN
                </button>

            </form>

            <div class="social-auth">

                <button type="button" id="facebookLogin" class="fb-btn">
                    Continue with Facebook
                </button>

                <button type="button" id="googleLogin" class="google-btn">
                    Continue with Google
                </button>

            </div>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>

        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
